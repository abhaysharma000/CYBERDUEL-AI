[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyberduel-ai"
version = "0.1.0"
description = "Continuously improving defensive cybersecurity research and protection platform"
readme = "README.md"
requires-python = ">=3.12, <3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "CyberDuel AI Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "apps/api/app",
    "packages/shared-contracts/cyberduel_contracts",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "apps/api/tests",
    "packages/shared-contracts/tests",
    "packages/policy-engine/tests",
    "services/lab-worker/tests",
    "services/evaluator/tests",
    "tests/integration",
]
pythonpath = [
    ".",
    "apps/api",
    "packages/shared-contracts",
    "packages/threat-intelligence",
    "packages/policy-engine",
    "services/lab-worker",
    "services/evaluator",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests requiring running external services (PostgreSQL, Redis)",
    "slow: marks tests that take more time to run",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "B008", "N818"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
