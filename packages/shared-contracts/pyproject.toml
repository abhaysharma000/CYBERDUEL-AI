[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyberduel-contracts"
version = "0.1.0"
description = "Canonical shared data contracts, schemas, and enums for CyberDuel AI"
requires-python = ">=3.12, <3.13"
dependencies = [
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cyberduel_contracts"]

