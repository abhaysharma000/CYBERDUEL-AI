name: CyberDuel AI - Continuous Integration & Security Pipeline

on:
  push:
    branches: [main, master, "release/*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-lint-and-test:
    name: Backend Lint, Type-Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python Dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Ruff Lint & Format Check
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Run Database Migrations Check
        run: |
          source .venv/bin/activate
          python scripts/run_migrations.py

      - name: Pytest Backend Test Suite
        run: |
          source .venv/bin/activate
          pytest --cov=apps/api/app --cov=packages --cov-report=term-missing

  extension-test-and-build:
    name: Browser Extension Tests & Manifest V3 Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/browser-extension/package.json

      - name: Install Dependencies
        working-directory: apps/browser-extension
        run: npm ci

      - name: Type-Check
        working-directory: apps/browser-extension
        run: npm run type-check

      - name: Vitest Unit Tests
        working-directory: apps/browser-extension
        run: npm run test

      - name: Build Manifest V3 Production Bundle
        working-directory: apps/browser-extension
        run: npm run build

      - name: Verify Dist Artifacts
        working-directory: apps/browser-extension
        run: |
          test -f dist/manifest.json
          test -f dist/service-worker.js
          test -f dist/popup.html
          test -f dist/warning.html

  dashboard-test-and-build:
    name: Command Center Dashboard Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/dashboard/package.json

      - name: Install Dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Type-Check
        working-directory: apps/dashboard
        run: npm run type-check

      - name: Vitest Unit Tests
        working-directory: apps/dashboard
        run: npm run test

      - name: Build Production SPA
        working-directory: apps/dashboard
        run: npm run build

      - name: Verify Dashboard Assets
        working-directory: apps/dashboard
        run: |
          test -f dist/index.html

  android-test:
    name: Android Mobile Companion Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Configure SDK
        run: |
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > apps/mobile/local.properties

      - name: Make Gradlew Executable
        run: chmod +x ./apps/mobile/gradlew

      - name: Run Android Unit Tests
        working-directory: apps/mobile
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

  security-audit:
    name: Secret Scanning, Cross-Language Parity & Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and Dependencies
        uses: astral-sh/setup-uv@v3
      - run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Verify Cross-Language Vector Parity
        run: |
          source .venv/bin/activate
          pytest tests/integration/test_cross_language_vectors.py -v

      - name: Scan for Hardcoded Private Keys in Client Bundles
        run: |
          # Ensure no PEM private keys are bundled inside edge client applications
          ! grep -rn "BEGIN PRIVATE KEY" apps/browser-extension/
          ! grep -rn "BEGIN PRIVATE KEY" apps/dashboard/
          ! grep -rn "BEGIN PRIVATE KEY" apps/mobile/app/src/main/

  e2e-integration:
    name: Authoritative E2E Lifecycle & Deployment Preflight
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, extension-test-and-build, dashboard-test-and-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and Dependencies
        uses: astral-sh/setup-uv@v3
      - run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run E2E Research to Release Lifecycle
        run: |
          source .venv/bin/activate
          pytest tests/integration/test_e2e_research_to_release.py -v

      - name: Execute Railway Deployment Preflight
        run: |
          source .venv/bin/activate
          python scripts/railway_preflight.py --skip-network
