services:
  - type: web
    name: cyberduel-ai
    env: python
    region: oregon
    plan: free
    autoDeploy: true
    buildCommand: "bash build.sh"
    startCommand: "python scripts/run_migrations.py && uvicorn apps.api.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

